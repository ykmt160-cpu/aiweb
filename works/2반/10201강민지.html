<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화장품 개발자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    /* 대표 색깔 3가지 */
    --pink:#FFD9E3;      /* 연핑크 */
    --blue:#D3E9FB;      /* 연파랑 */
    --beige:#FBF0E2;     /* 연베이지 */
    /* 위 색의 진한 톤 (글자·선·포인트용) */
    --pink-deep:#E7849F;
    --blue-deep:#5F85AD;
    --beige-deep:#E9D6BE;
    --text:#4F6C90;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--beige);
    color:var(--text);
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    background-image:
      radial-gradient(circle at 12% 18%, var(--pink) 0 3px, transparent 4px),
      radial-gradient(circle at 82% 42%, var(--blue) 0 4px, transparent 5px),
      radial-gradient(circle at 30% 78%, var(--blue) 0 3px, transparent 4px),
      radial-gradient(circle at 90% 88%, var(--pink) 0 4px, transparent 5px);
    background-size:340px 340px;
  }

  /* ---------- 상단 ---------- */
  header{
    text-align:center;
    padding:48px 20px 40px;
    background:linear-gradient(180deg,var(--pink) 0%,var(--blue) 100%);
    border-radius:0 0 48px 48px;
    position:relative;
  }
  header::after{
    content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;
    background:
      radial-gradient(circle at 12px 0, var(--blue) 11px, transparent 12px) 0 0/24px 12px repeat-x;
  }
  .ribbon{width:130px;height:auto;display:block;margin:0 auto 6px;animation:float 3.6s ease-in-out infinite}
  h1{
    font-weight:400;
    font-size:clamp(2.2rem,7vw,3.6rem);
    color:var(--text);
    letter-spacing:.04em;
    line-height:1.3;
  }
  .hearts-row{display:flex;gap:12px;justify-content:center;margin-top:14px}
  .heart{width:22px;height:22px;display:inline-block}
  .heart:nth-child(2){width:30px;height:30px;margin-top:-4px}

  /* ---------- 본문 ---------- */
  main{max-width:960px;margin:0 auto;padding:56px 20px 32px}
  section{
    background:#fff8;
    background:rgba(255,255,255,.55);
    border:3px dashed var(--pink-deep);
    border-radius:32px;
    padding:36px 28px 40px;
    margin-bottom:40px;
    position:relative;
    opacity:0;transform:translateY(26px);
    transition:opacity .7s ease, transform .7s ease;
  }
  section.show{opacity:1;transform:none}
  section:nth-of-type(even){border-color:var(--blue-deep)}
  section h2{
    font-weight:400;
    font-size:clamp(1.5rem,4.4vw,2rem);
    text-align:center;
    margin-bottom:22px;
    color:var(--text);
  }
  section h2 span{
    display:inline-block;
    padding:2px 22px 4px;
    background:var(--pink);
    border-radius:999px;
  }
  section:nth-of-type(even) h2 span{background:var(--blue)}
  .corner{position:absolute;width:34px;height:34px}
  .corner.tl{top:-18px;left:-10px;transform:rotate(-14deg)}
  .corner.br{bottom:-18px;right:-10px;transform:rotate(14deg)}

  /* 인사말 */
  .greet{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}
  .greet p{font-size:clamp(1.5rem,5vw,2.3rem);text-align:center;line-height:1.5}
  .greet svg{width:90px;height:auto;flex:none}

  /* 소개 */
  .intro p{
    font-size:clamp(1.05rem,2.6vw,1.2rem);
    line-height:2.05;
    background:var(--beige);
    border-radius:24px;
    padding:26px 26px;
    word-break:keep-all;
    border:2px solid var(--beige-deep);
  }

  /* 만든 화장품 */
  .items{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .item{
    background:var(--beige);
    border:2px solid var(--beige-deep);
    border-radius:26px;
    padding:26px 12px 22px;
    text-align:center;
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .item:nth-child(1){background:var(--pink)}
  .item:nth-child(2){background:var(--blue)}
  .item:hover,.item:focus-visible{transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 10px 0 rgba(95,133,173,.18);outline:none}
  .item svg{width:96px;height:96px;display:block;margin:0 auto 10px}
  .item strong{font-weight:400;font-size:1.5rem;color:var(--text)}

  /* 하단 */
  footer{
    text-align:center;
    padding:30px 20px 56px;
  }
  footer p{
    display:inline-flex;align-items:center;gap:12px;
    font-size:clamp(1.3rem,4vw,1.7rem);
    background:var(--pink);
    padding:10px 28px 12px;
    border-radius:999px;
    color:var(--text);
  }
  footer .heart{width:20px;height:20px}

  /* 떠오르는 하트 (클릭 효과) */
  .pop{position:fixed;pointer-events:none;z-index:50;width:22px;height:22px;animation:rise 1.2s ease-out forwards}

  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  @keyframes rise{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}

  /* ---------- 반응형 ---------- */
  @media (max-width:720px){
    header{padding:36px 16px 32px;border-radius:0 0 36px 36px}
    .ribbon{width:104px}
    main{padding:44px 16px 20px}
    section{padding:30px 18px 32px;border-radius:26px}
    .items{grid-template-columns:1fr;gap:16px}
    .item{display:flex;align-items:center;justify-content:center;gap:18px;padding:18px 14px;text-align:left}
    .item svg{margin:0;width:72px;height:72px}
    .intro p{padding:20px 18px}
  }
  @media (prefers-reduced-motion:reduce){
    .ribbon{animation:none}
    section{opacity:1;transform:none;transition:none}
    .pop{display:none}
  }
</style>
</head>
<body>

<!-- 재사용 심볼 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="heart" viewBox="0 0 32 32">
      <path d="M16 28.5 C6 20.5 3 15.5 3 11.2 C3 7.3 6 4.5 9.6 4.5 C12.4 4.5 14.8 6 16 8.4 C17.2 6 19.6 4.5 22.4 4.5 C26 4.5 29 7.3 29 11.2 C29 15.5 26 20.5 16 28.5 Z" fill="#E7849F" stroke="#E7849F" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="10.2" cy="10.2" rx="2.4" ry="1.5" transform="rotate(-35 10.2 10.2)" fill="#FFD9E3"/>
    </symbol>
    <symbol id="heart-blue" viewBox="0 0 32 32">
      <path d="M16 28.5 C6 20.5 3 15.5 3 11.2 C3 7.3 6 4.5 9.6 4.5 C12.4 4.5 14.8 6 16 8.4 C17.2 6 19.6 4.5 22.4 4.5 C26 4.5 29 7.3 29 11.2 C29 15.5 26 20.5 16 28.5 Z" fill="#5F85AD" stroke="#5F85AD" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="10.2" cy="10.2" rx="2.4" ry="1.5" transform="rotate(-35 10.2 10.2)" fill="#D3E9FB"/>
    </symbol>
  </defs>
</svg>

<header>
  <!-- 리본 -->
  <svg class="ribbon" viewBox="0 0 160 110" role="img" aria-label="리본">
    <path d="M80 52 C60 70 52 92 44 100 L66 90 L72 106 C76 86 80 70 80 52Z" fill="#FBF0E2" stroke="#E7849F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80 52 C100 70 108 92 116 100 L94 90 L88 106 C84 86 80 70 80 52Z" fill="#FBF0E2" stroke="#E7849F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80 50 C62 20 28 6 14 22 C4 36 22 66 80 56Z" fill="#FFFFFF" fill-opacity=".0"/>
    <path d="M80 52 C60 22 28 8 14 24 C4 38 24 64 80 56Z" fill="#FFD9E3" stroke="#E7849F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80 52 C100 22 132 8 146 24 C156 38 136 64 80 56Z" fill="#FFD9E3" stroke="#E7849F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 28 C42 26 56 34 66 46" fill="none" stroke="#E7849F" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
    <path d="M130 28 C118 26 104 34 94 46" fill="none" stroke="#E7849F" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
    <rect x="68" y="42" width="24" height="22" rx="9" fill="#D3E9FB" stroke="#5F85AD" stroke-width="3"/>
    <circle cx="80" cy="53" r="2.4" fill="#5F85AD"/>
  </svg>
  <h1>화장품 개발자</h1>
  <div class="hearts-row" aria-hidden="true">
    <svg class="heart"><use href="#heart"/></svg>
    <svg class="heart"><use href="#heart-blue"/></svg>
    <svg class="heart"><use href="#heart"/></svg>
  </div>
</header>

<main>

  <!-- 섹션 1 -->
  <section id="greeting">
    <svg class="corner tl" aria-hidden="true"><use href="#heart"/></svg>
    <h2><span>인사말</span></h2>
    <div class="greet">
      <!-- 립스틱 -->
      <svg viewBox="0 0 80 130" aria-hidden="true">
        <path d="M26 60 L26 22 C26 12 34 4 40 4 C46 4 54 12 54 22 L54 60Z" fill="#FFD9E3" stroke="#E7849F" stroke-width="3" stroke-linejoin="round"/>
        <path d="M26 22 L54 36" stroke="#E7849F" stroke-width="3" stroke-linecap="round" opacity=".0"/>
        <path d="M31 24 C31 18 35 12 38 10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        <rect x="22" y="60" width="36" height="12" rx="3" fill="#FBF0E2" stroke="#E9D6BE" stroke-width="3"/>
        <rect x="18" y="72" width="44" height="52" rx="8" fill="#D3E9FB" stroke="#5F85AD" stroke-width="3"/>
        <rect x="24" y="80" width="6" height="36" rx="3" fill="#fff" opacity=".7"/>
        <use href="#heart" x="34" y="88" width="20" height="20"/>
      </svg>
      <p>안녕하세요. 저는 강민지입니다</p>
    </div>
  </section>

  <!-- 섹션 2 -->
  <section id="about" class="intro">
    <h2><span>화장품 개발자 소개</span></h2>
    <p>화장품 개발자는 피부와 모발에 대한 이해를 바탕으로 다양한 원료와 성분의 특성 및 효능을 연구하고, 이를 적절하게 배합하여 안전하고 효과적인 화장품을 만드는 전문가로, 소비자의 피부 고민과 요구를 파악하고 최신 뷰티 트렌드를 반영하여 스킨케어, 메이크업, 헤어 제품 등 다양한 화장품을 기획하고 개발하며, 제품의 품질과 안정성을 확인하고 지속적으로 개선하는 역할을 합니다.</p>
    <svg class="corner br" aria-hidden="true"><use href="#heart-blue"/></svg>
  </section>

  <!-- 섹션 3 -->
  <section id="works">
    <svg class="corner tl" aria-hidden="true"><use href="#heart"/></svg>
    <h2><span>지금까지 만든 화장품들</span></h2>
    <div class="items">

      <!-- 섀도우 (팔레트) -->
      <div class="item" tabindex="0">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <rect x="6" y="18" width="88" height="64" rx="16" fill="#FBF0E2" stroke="#E7849F" stroke-width="3"/>
          <circle cx="30" cy="42" r="13" fill="#FFD9E3" stroke="#E7849F" stroke-width="2.5"/>
          <circle cx="70" cy="42" r="13" fill="#D3E9FB" stroke="#5F85AD" stroke-width="2.5"/>
          <circle cx="30" cy="68" r="0" fill="#FFD9E3"/>
          <rect x="17" y="60" width="26" height="14" rx="7" fill="#D3E9FB" stroke="#5F85AD" stroke-width="2.5"/>
          <rect x="57" y="60" width="26" height="14" rx="7" fill="#FFD9E3" stroke="#E7849F" stroke-width="2.5"/>
          <path d="M22 36 C25 32 30 31 34 33" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
          <use href="#heart" x="41" y="30" width="18" height="18"/>
        </svg>
        <strong>섀도우</strong>
      </div>

      <!-- 틴트 -->
      <div class="item" tabindex="0">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g transform="rotate(30 50 50)">
            <path d="M43 6 L57 6 L56 26 L44 26Z" fill="#FFD9E3" stroke="#E7849F" stroke-width="3" stroke-linejoin="round"/>
            <path d="M44 26 L56 26 C58 34 58 40 56 44 L44 44 C42 40 42 34 44 26Z" fill="#FBF0E2" stroke="#E9D6BE" stroke-width="3" stroke-linejoin="round"/>
            <rect x="38" y="44" width="24" height="46" rx="9" fill="#FFFFFF" stroke="#5F85AD" stroke-width="3"/>
            <rect x="38" y="54" width="24" height="26" fill="#FFD9E3" stroke="none"/>
            <rect x="38" y="44" width="24" height="46" rx="9" fill="none" stroke="#5F85AD" stroke-width="3"/>
          </g>
          <use href="#heart" x="38" y="46" width="20" height="20"/>
        </svg>
        <strong>틴트</strong>
      </div>

      <!-- 파운데이션 -->
      <div class="item" tabindex="0">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M44 6 L44 14 L56 14 L56 6Z" fill="#FFD9E3" stroke="#E7849F" stroke-width="3" stroke-linejoin="round"/>
          <path d="M50 12 L50 20 M38 6 L44 6 M56 6 L70 8 L70 14 L56 14" fill="none" stroke="#E7849F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="40" y="20" width="20" height="10" rx="3" fill="#D3E9FB" stroke="#5F85AD" stroke-width="3"/>
          <path d="M32 40 C32 32 38 30 50 30 C62 30 68 32 68 40 L68 86 C68 91 64 94 58 94 L42 94 C36 94 32 91 32 86Z" fill="#FBF0E2" stroke="#5F85AD" stroke-width="3" stroke-linejoin="round"/>
          <path d="M33.5 62 L66.5 62 L66.5 86 C66.5 90 63 92.5 58 92.5 L42 92.5 C37 92.5 33.5 90 33.5 86Z" fill="#E9D6BE" opacity=".9"/>
          <rect x="38" y="38" width="5" height="26" rx="2.5" fill="#fff" opacity=".8"/>
          <use href="#heart" x="43" y="46" width="16" height="16"/>
        </svg>
        <strong>파운데이션</strong>
      </div>

    </div>
    <svg class="corner br" aria-hidden="true"><use href="#heart-blue"/></svg>
  </section>

</main>

<footer>
  <p>
    <svg class="heart" aria-hidden="true"><use href="#heart"/></svg>
    참고만 하세요
    <svg class="heart" aria-hidden="true"><use href="#heart-blue"/></svg>
  </p>
</footer>

<script>
  // 스크롤하면 섹션이 부드럽게 나타납니다
  (function () {
    var sections = document.querySelectorAll('section');
    if (!('IntersectionObserver' in window)) {
      sections.forEach(function (s) { s.classList.add('show'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('show'); io.unobserve(e.target); }
      });
    }, { threshold: 0.12 });
    sections.forEach(function (s) { io.observe(s); });
  })();

  // 화장품 카드를 누르면 하트가 떠오릅니다
  (function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function pop(x, y) {
      if (reduce) return;
      for (var i = 0; i < 5; i++) {
        var ns = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(ns, 'svg');
        var use = document.createElementNS(ns, 'use');
        use.setAttribute('href', i % 2 ? '#heart-blue' : '#heart');
        svg.appendChild(use);
        svg.setAttribute('class', 'pop');
        svg.style.left = (x + (Math.random() * 60 - 30)) + 'px';
        svg.style.top = (y + (Math.random() * 20 - 10)) + 'px';
        svg.style.animationDelay = (i * 0.07) + 's';
        document.body.appendChild(svg);
        setTimeout(function (el) { el.remove(); }, 1500, svg);
      }
    }
    document.querySelectorAll('.item').forEach(function (item) {
      item.addEventListener('click', function (e) { pop(e.clientX, e.clientY); });
      item.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          var r = item.getBoundingClientRect();
          pop(r.left + r.width / 2, r.top + r.height / 2);
        }
      });
    });
  })();
</script>
</body>
</html>
