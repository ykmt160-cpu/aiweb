<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박세빈 · 미래의 피부관리사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffdf5; --surface:#ffffff; --soft:#fff6cc; --yellow:#ffd84d; --yellow-d:#e8b400;
  --text:#4a4130; --muted:#8a7f66; --line:#f3e7b3; --shadow:0 6px 18px rgba(232,180,0,.15);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f1b10; --surface:#2b2617; --soft:#3a3318; --yellow:#ffd84d; --yellow-d:#ffd84d;
    --text:#fbf3d6; --muted:#c9bc92; --line:#4a4222; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1b10; --surface:#2b2617; --soft:#3a3318; --yellow:#ffd84d; --yellow-d:#ffd84d;
  --text:#fbf3d6; --muted:#c9bc92; --line:#4a4222; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.8}
h1,h2,h3{font-family:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;font-weight:400;line-height:1.35;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:20}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:2px solid var(--line)}
nav .in{max-width:960px;margin:auto;display:flex;align-items:center;gap:6px;padding:10px 16px;overflow-x:auto}
nav .logo{font-family:"Jua",sans-serif;font-size:19px;margin-right:auto;white-space:nowrap}
nav a{color:var(--text);text-decoration:none;font-size:15px;padding:6px 12px;border-radius:99px;white-space:nowrap}
nav a:hover{background:var(--soft)}
.hero{text-align:center;padding:64px 20px 56px;background:linear-gradient(180deg,var(--soft),var(--bg))}
.badge{width:120px;height:120px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:58px;margin:0 auto 20px;box-shadow:var(--shadow);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.hero h1{font-size:clamp(32px,7vw,48px)}
.hero p{margin:10px 0 0;color:var(--muted)}
.tag{display:inline-block;margin-top:18px;background:var(--surface);border:2px solid var(--yellow);border-radius:99px;padding:6px 18px;font-size:16px}
.quote{max-width:560px;margin:22px auto 0}
main{max-width:960px;margin:auto;padding:0 18px}
section{padding:52px 0 8px}
.title{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.title .ic{width:46px;height:46px;border-radius:14px;background:var(--yellow);display:grid;place-items:center;font-size:24px}
.title h2{font-size:clamp(24px,5vw,30px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.card h3{font-size:20px;margin-bottom:8px}
.card .ic{font-size:30px;display:block;margin-bottom:6px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.info div:last-child{border:0}
.info b{color:var(--yellow-d);font-weight:400;font-family:"Jua",sans-serif}
.empty{border:2px dashed var(--yellow);border-radius:14px;padding:12px 14px;color:var(--muted);background:var(--soft);font-size:15px}
.rank{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--yellow);color:#4a4130;display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:20px}
.rank > div{flex:1}
.reason{font-size:18px}
.reveal{opacity:0;transform:translateY(16px);transition:.6s}
.reveal.on{opacity:1;transform:none}
footer{margin-top:56px;padding:26px 16px;text-align:center;background:var(--soft);color:var(--muted);font-size:15px}
@media (max-width:520px){body{font-size:16px}.hero{padding-top:44px}.info div{flex-direction:column;gap:0}}
@media (prefers-reduced-motion:reduce){.badge{animation:none}.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<nav><div class="in">
  <span class="logo">🌼 세빈의 이야기</span>
  <a href="#intro">나 소개</a><a href="#why">선택 이유</a><a href="#ai">AI 시대</a><a href="#skills">기를 역량</a><a href="#promise">다짐</a>
</div></nav>

<header class="hero">
  <div class="badge">🧖‍♀️</div>
  <h1>안녕하세요, 박세빈입니다</h1>
  <p>피부미용 분야에서 일하는</p>
  <span class="tag">✨ 미래의 피부관리사 ✨</span>
  <div class="quote" id="oneLine"></div>
</header>

<main>
  <section id="intro" class="reveal">
    <div class="title"><span class="ic">🌼</span><h2>미래의 나 소개</h2></div>
    <div class="card info">
      <div><b>이름</b><span>박세빈</span></div>
      <div><b>나이</b><span>27세</span></div>
      <div><b>희망 직업</b><span>피부관리사</span></div>
      <div><b>일하는 분야</b><span>피부미용</span></div>
    </div>
  </section>

  <section id="why" class="reveal">
    <div class="title"><span class="ic">💛</span><h2>피부관리사를 선택한 이유</h2></div>
    <div class="card reason">
      <span class="ic" style="font-size:34px">🌷</span>
      피부미용에 관심이 많고, 사람들에게 아름다움과 자신감을 선물하며 보람을 느낄 수 있는 직업이라고 생각해 피부관리사를 선택했습니다.
    </div>
  </section>

  <section id="ai" class="reveal">
    <div class="title"><span class="ic">🤖</span><h2>AI 시대와 나의 역할</h2></div>
    <div class="grid g2" id="aiCards"></div>
  </section>

  <section id="skills" class="reveal">
    <div class="title"><span class="ic">🧴</span><h2>내가 기를 역량 TOP 3</h2></div>
    <div class="grid" id="skillCards"></div>
  </section>

  <section id="promise" class="reveal">
    <div class="title"><span class="ic">🌿</span><h2>나의 다짐</h2></div>
    <div class="card" id="promiseCard"></div>
  </section>
</main>

<footer>🌼 박세빈 · 미래의 피부관리사 🌼<br><span id="siteInfo"></span></footer>

<script>
/* ✏️ 여기만 고치면 웹사이트 내용이 바뀌어요! 비워 두면(빈 글자 "") "아직 작성하지 않았어요"로 표시돼요. */
var CONTENT = {
  oneLine: "",              // 방문자에게 전하고 싶은 한 문장
  siteTitle: "",            // 웹사이트 제목
  purpose: "",              // 만드는 목적
  audience: "",             // 사이트를 볼 사람
  aiHelps: "",              // AI가 도와줄 일
  myJob: "",                // 내가 직접 맡을 일
  skills: ["", "", ""],     // AI 시대 역량 TOP 3
  promise: ""               // 나의 다짐
};

function box(text, hint){
  return text && text.trim() ? "<p style='margin:0'>" + esc(text) + "</p>"
    : "<div class='empty'>🌱 " + (hint || "아직 작성하지 않았어요") + "</div>";
}
function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

var q = document.getElementById("oneLine");
if (CONTENT.oneLine.trim()) q.innerHTML = "<p style='font-size:19px'>“" + esc(CONTENT.oneLine) + "”</p>";

document.getElementById("aiCards").innerHTML =
  "<div class='card'><span class='ic'>💡</span><h3>AI가 도와줄 일</h3>" + box(CONTENT.aiHelps) + "</div>" +
  "<div class='card'><span class='ic'>🤲</span><h3>내가 직접 맡을 일</h3>" + box(CONTENT.myJob) + "</div>";

document.getElementById("skillCards").innerHTML = CONTENT.skills.map(function(s, i){
  return "<div class='card rank'><div class='num'>" + (i + 1) + "</div><div>" + box(s) + "</div></div>";
}).join("");

document.getElementById("promiseCard").innerHTML = box(CONTENT.promise);

var info = [];
if (CONTENT.siteTitle.trim()) info.push(esc(CONTENT.siteTitle));
if (CONTENT.purpose.trim()) info.push("목적: " + esc(CONTENT.purpose));
if (CONTENT.audience.trim()) info.push("대상: " + esc(CONTENT.audience));
document.getElementById("siteInfo").innerHTML = info.join(" · ");

var els = document.querySelectorAll(".reveal");
if ("IntersectionObserver" in window){
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("on"); io.unobserve(e.target); } });
  }, {threshold: .12});
  els.forEach(function(el){ io.observe(el); });
} else { els.forEach(function(el){ el.classList.add("on"); }); }
</script>
</body>
</html>
