<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미래의 나 소개</title>
<style>
:root{--bg:#ffffff;--fg:#1a1a1a;--card:#f4f4f4;--line:#dddddd;--muted:#666666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#f0f0f0;--card:#222222;--line:#3a3a3a;--muted:#aaaaaa}}
:root[data-theme="dark"]{--bg:#161616;--fg:#f0f0f0;--card:#222222;--line:#3a3a3a;--muted:#aaaaaa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:40px 20px}
h1{font-size:1.8rem;margin:0 0 28px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.label{font-size:.85rem;color:var(--muted);margin:0 0 4px}
.value{font-size:1.1rem;margin:0}
</style>
</head>
<body>
<main>
<h1>미래의 나 소개</h1>
<div class="item"><p class="label">나의 희망 직업</p><p class="value">헤어 디자이너</p></div>
<div class="item"><p class="label">미래의 나는 어떤 사람? (이름·나이·일하는 곳)</p><p class="value">헤어샵, 25살</p></div>
<div class="item"><p class="label">이 직업을 선택한 이유</p><p class="value">헤어에 관심이 있어서</p></div>
<div class="item"><p class="label">이 직업에서 AI가 도와줄 일</p><p class="value">커트 디자인이나 트렌드 알려주기</p></div>
<div class="item"><p class="label">이 직업에서 내가 직접 맡을 일</p><p class="value">직업</p></div>
</main>
</body>
</html>
